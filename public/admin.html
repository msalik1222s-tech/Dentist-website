<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Appointment Requests — Admin</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; color: #1c2b2a; }
  h1 { font-size: 1.4rem; }
  #keyBar { display: flex; gap: .5rem; margin-bottom: 1.5rem; }
  #keyBar input { flex: 1; padding: .5rem .7rem; border: 1px solid #ccc; border-radius: 6px; }
  #keyBar button { padding: .5rem 1rem; border: none; border-radius: 6px; background: #0f7a6e; color: #fff; cursor: pointer; }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  th, td { text-align: left; padding: .6rem .5rem; border-bottom: 1px solid #e4e4e4; vertical-align: top; }
  th { background: #f5f7f6; }
  #status { color: #a3342b; margin-bottom: 1rem; }
  code { font-size: .85rem; letter-spacing: .04em; background: #f0f4f3; padding: .1rem .35rem; border-radius: 4px; }
</style>
</head>
<body>
  <h1>Appointment requests</h1>
  <div id="keyBar">
    <input id="key" type="password" placeholder="Admin key" />
    <button id="load">Load</button>
  </div>
  <p id="status"></p>
  <table id="results" hidden>
    <thead>
      <tr><th>Submitted</th><th>Ref</th><th>Name</th><th>Phone</th><th>Date</th><th>Time</th><th>Service</th><th>Status</th><th>Message</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

<script>
// Everything lives in an IIFE. At global scope `var status = <element>` does
// not create a variable — it assigns to window.status, which the browser
// coerces to a string, so every `status.textContent = ...` below silently did
// nothing and errors never appeared on screen.
(function () {
  "use strict";

  var keyInput = document.getElementById("key");
  var statusEl = document.getElementById("status");
  var table = document.getElementById("results");
  var rows = document.getElementById("rows");

  var savedKey = sessionStorage.getItem("adminKey");
  if (savedKey) keyInput.value = savedKey;

  function escapeHtml(s) {
    return String(s || "").replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function load() {
    var key = keyInput.value.trim();
    if (!key) { statusEl.textContent = "Enter the admin key."; return; }
    sessionStorage.setItem("adminKey", key);
    statusEl.textContent = "Loading...";
    table.hidden = true;

    fetch("/api/appointments", { headers: { "x-admin-key": key } })
      .then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
      .then(function (res) {
        if (!res.ok) {
          statusEl.textContent = (res.data && res.data.error) || "Failed to load.";
          return;
        }
        statusEl.textContent = res.data.appointments.length + " request(s).";
        rows.innerHTML = res.data.appointments.map(function (a) {
          return "<tr>" +
            "<td>" + escapeHtml(new Date(a.createdAt).toLocaleString()) + "</td>" +
            "<td><code>" + escapeHtml(a.ref || "-") + "</code></td>" +
            "<td>" + escapeHtml(a.name) + "</td>" +
            "<td>" + escapeHtml(a.phone) + "</td>" +
            "<td>" + escapeHtml(a.date) + "</td>" +
            "<td>" + escapeHtml(a.time || "-") + "</td>" +
            "<td>" + escapeHtml(a.service) + "</td>" +
            "<td>" + escapeHtml(a.status || "pending") + "</td>" +
            "<td>" + escapeHtml(a.message) + "</td>" +
            "</tr>";
        }).join("");
        table.hidden = false;
      })
      .catch(function () { statusEl.textContent = "Network error."; });
  }

  document.getElementById("load").addEventListener("click", load);
  keyInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") load();
  });
  if (savedKey) load();
})();
</script>
</body>
</html>
