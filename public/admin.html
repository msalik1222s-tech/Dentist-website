<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Appointment Requests — Admin</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; color: #1c2b2a; }
  h1 { font-size: 1.4rem; }
  h2 { font-size: 1.15rem; margin-top: 2.5rem; }
  #handoffStatus { color: #4a5a58; margin-bottom: .5rem; }
  #handoffRows button { padding: .3rem .7rem; border: none; border-radius: 5px; background: #0f7a6e; color: #fff; cursor: pointer; }
  #keyBar { display: flex; gap: .5rem; margin-bottom: 1.5rem; }
  #keyBar input { flex: 1; padding: .5rem .7rem; border: 1px solid #ccc; border-radius: 6px; }
  #keyBar button { padding: .5rem 1rem; border: none; border-radius: 6px; background: #0f7a6e; color: #fff; cursor: pointer; }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  th, td { text-align: left; padding: .6rem .5rem; border-bottom: 1px solid #e4e4e4; vertical-align: top; }
  th { background: #f5f7f6; }
  #status { color: #a3342b; margin-bottom: 1rem; }
</style>
</head>
<body>
  <h1>Appointment requests</h1>
  <div id="keyBar">
    <input id="key" type="password" placeholder="Admin key" />
    <button id="load">Load</button>
  </div>
  <p id="status"></p>
  <table id="results" hidden>
    <thead>
      <tr><th>Submitted</th><th>Name</th><th>Phone</th><th>Date</th><th>Time</th><th>Service</th><th>Status</th><th>Message</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <h2 id="handoffHeading" hidden>Chat handoffs</h2>
  <p id="handoffStatus"></p>
  <table id="handoffs" hidden>
    <thead>
      <tr><th>Requested</th><th>Reason</th><th>Patient</th><th>Phone</th><th>Channel</th><th>What they need</th><th></th></tr>
    </thead>
    <tbody id="handoffRows"></tbody>
  </table>

<script>
  var keyInput = document.getElementById("key");
  var status = document.getElementById("status");
  var table = document.getElementById("results");
  var rows = document.getElementById("rows");

  var savedKey = sessionStorage.getItem("adminKey");
  if (savedKey) keyInput.value = savedKey;

  function escapeHtml(s) {
    return String(s || "").replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function load() {
    var key = keyInput.value.trim();
    if (!key) { status.textContent = "Enter the admin key."; return; }
    sessionStorage.setItem("adminKey", key);
    status.textContent = "Loading...";
    table.hidden = true;

    fetch("/api/appointments", { headers: { "x-admin-key": key } })
      .then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
      .then(function (res) {
        if (!res.ok) {
          status.textContent = res.data.error || "Failed to load.";
          return;
        }
        status.textContent = res.data.appointments.length + " request(s).";
        rows.innerHTML = res.data.appointments.map(function (a) {
          return "<tr>" +
            "<td>" + escapeHtml(new Date(a.createdAt).toLocaleString()) + "</td>" +
            "<td>" + escapeHtml(a.name) + "</td>" +
            "<td>" + escapeHtml(a.phone) + "</td>" +
            "<td>" + escapeHtml(a.date) + "</td>" +
            "<td>" + escapeHtml(a.time || "-") + "</td>" +
            "<td>" + escapeHtml(a.service) + "</td>" +
            "<td>" + escapeHtml(a.status || "pending") + "</td>" +
            "<td>" + escapeHtml(a.message) + "</td>" +
            "</tr>";
        }).join("");
        table.hidden = false;
      })
      .catch(function () { status.textContent = "Network error."; });
  }

  /* Conversations the AI assistant escalated. These are the ones a person has
     to pick up, so they sit alongside the appointment requests rather than
     behind another login. */
  var handoffHeading = document.getElementById("handoffHeading");
  var handoffStatus = document.getElementById("handoffStatus");
  var handoffTable = document.getElementById("handoffs");
  var handoffRows = document.getElementById("handoffRows");

  function resolveHandoff(id) {
    var key = keyInput.value.trim();
    fetch("/api/admin/handoffs/" + encodeURIComponent(id) + "/resolve", {
      method: "POST",
      headers: { "x-admin-key": key }
    })
      .then(function () { loadHandoffs(); })
      .catch(function () { handoffStatus.textContent = "Network error."; });
  }

  function loadHandoffs() {
    var key = keyInput.value.trim();
    if (!key) return;

    fetch("/api/admin/handoffs?status=open", { headers: { "x-admin-key": key } })
      .then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
      .then(function (res) {
        handoffHeading.hidden = false;
        if (!res.ok) { handoffStatus.textContent = res.data.error || "Failed to load handoffs."; return; }

        var list = res.data.handoffs || [];
        handoffStatus.textContent = list.length
          ? list.length + " conversation(s) waiting for someone."
          : "Nothing waiting.";
        handoffTable.hidden = list.length === 0;

        handoffRows.innerHTML = list.map(function (h) {
          return "<tr>" +
            "<td>" + escapeHtml(new Date(h.createdAt).toLocaleString()) + "</td>" +
            "<td>" + escapeHtml(h.reason) + "</td>" +
            "<td>" + escapeHtml(h.patientName || "-") + "</td>" +
            "<td>" + escapeHtml(h.patientPhone || "-") + "</td>" +
            "<td>" + escapeHtml(h.channel) + "</td>" +
            "<td>" + escapeHtml(h.summary) + "</td>" +
            '<td><button type="button" data-resolve="' + escapeHtml(h.id) + '">Done</button></td>' +
            "</tr>";
        }).join("");
      })
      .catch(function () { handoffStatus.textContent = "Network error."; });
  }

  handoffRows.addEventListener("click", function (e) {
    var id = e.target && e.target.getAttribute("data-resolve");
    if (id) resolveHandoff(id);
  });

  function loadAll() {
    load();
    loadHandoffs();
  }

  document.getElementById("load").addEventListener("click", loadAll);
  if (savedKey) loadAll();
</script>
</body>
</html>
